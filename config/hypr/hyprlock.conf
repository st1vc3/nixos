source = ~/.config/hypr/hyprlock-colors.conf
$font = JetBrainsMono Nerd Font

general {
  hide_cursor = true
}

background {
  monitor =
  path = $XDG_RUNTIME_DIR/hyprlock-background.jpg
  blur_size = 5
  blur_passes = 3
  brightness = 0.4
}

# CLOCK - same font and colors as the rest of the desktop
label {
  monitor =
  text = cmd[update:1000] echo "$(date +'%H:%M')"
  font_family = $font
  font_size = 90
  color = $text
  shadow_passes = 3
  shadow_size = 4
  shadow_color = rgba(00000099)
  position = 0, 180
  halign = center
  valign = center
}

# DATE
label {
  monitor =
  text = cmd[update:60000] echo "$(date +'%A, %d %B')"
  font_family = $font
  font_size = 20
  color = $yellow
  shadow_passes = 3
  shadow_size = 4
  shadow_color = rgba(00000099)
  position = 0, 110
  halign = center
  valign = center
}

# INPUT FIELD - rounding 10 matches decoration.rounding in hyprland.lua and
# the 10px radius used by the shell surfaces.
input-field {
  monitor =
  size = 350, 50
  rounding = 10
  font_family = $font
  outline_thickness = 4
  dots_size = 0.2
  dots_spacing = 0.2
  dots_center = true
  outer_color = $accent
  inner_color = $surface
  font_color = $text
  fade_on_empty = false
  hide_input = false
  check_color = $accent
  fail_color = $red
  fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
  capslock_color = $yellow
  shadow_passes = 3
  shadow_size = 4
  shadow_color = rgba(00000099)
  position = 0, -47
  halign = center
  valign = center
}
