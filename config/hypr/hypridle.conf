general {
    lock_cmd = pidof hyprlock || $HOME/.config/hypr/start-hyprlock
    # Start the locker and keep the sleep inhibitor until its Wayland surface
    # exists. If locking fails, remain inhibited instead of suspending with an
    # exposed desktop.
    before_sleep_cmd = $HOME/.config/hypr/start-hyprlock --immediate-render & until hyprctl layers -j | jq -e '.. | objects | select(.namespace? == "hyprlock")' >/dev/null; do sleep 0.05; done
}

listener {
    timeout = 600
    on-timeout = $HOME/.config/hypr/start-hyprlock
}
