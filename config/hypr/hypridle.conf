general {
    lock_cmd = pidof hyprlock || $HOME/.config/hypr/start-hyprlock
    # Let hypridle release its sleep delay inhibitor on the compositor's
    # session-lock notification. Hyprlock is not a layer-shell surface, so
    # polling `hyprctl layers` cannot detect it. Logind bounds delay inhibitors
    # by InhibitDelayMaxSec; they do not block sleep indefinitely on failure.
    inhibit_sleep = 3
    before_sleep_cmd = $HOME/.config/hypr/start-hyprlock --immediate-render
}

listener {
    timeout = 600
    on-timeout = $HOME/.config/hypr/start-hyprlock
}
