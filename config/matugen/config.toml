# Base template mappings. Home Manager conditionally appends the Quickshell
# mapping; see README.md. Application reloads are disabled because
# scripts/set-wallpaper.sh handles supported live reloads after rendering.
[config]
reload_apps = false

[templates.hyprlock-colors]
input_path = "~/.config/matugen/templates/hyprlock-colors.conf"
output_path = "~/.config/hypr/hyprlock-colors.conf"

[templates.kitty-colors]
input_path = "~/.config/matugen/templates/kitty-colors.conf"
output_path = "~/.config/kitty/colors.conf"
